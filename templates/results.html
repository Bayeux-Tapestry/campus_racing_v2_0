{% extends 'base.html' %}{% block body %}<section class="screen result"><div class="eyebrow">SESSION RESULT</div><div id="content"><h1>WAITING FOR RESULT</h1></div></section><script>async function load(){let s=await(await fetch('/api/state')).json(),r=s.latest_result;if(!r){location.href='/';return}let title=r.is_record?'NEW TRACK RECORD':r.is_pb?'PERSONAL BEST':'HOT LAP COMPLETE';content.innerHTML=`<div class="result-title">${title}</div><h1>${r.display_name}</h1><div class="result-time">${r.lap}</div><div class="position">P${r.position||'—'}</div><p>${s.cfg.track_name} · ${s.cfg.car_name}</p>`;if(Date.now()/1000-r.created_at>10&&!s.active)location.href='/'}load();setInterval(load,1000)</script>{% endblock %}
