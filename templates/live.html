{% extends 'base.html' %}{% block body %}<section class="screen live"><header><div class="eyebrow">CAMPUS RACING // LIVE TIMING</div><div id="rig" class="pill">{{cfg.rig_id}}</div></header><div class="live-grid"><div><div id="phase" class="phase">PREPARING</div><h1 id="driver">DRIVER</h1><p>{{cfg.track_name}} · {{cfg.car_name}}</p><div id="time" class="clock">--:--.---</div></div><div class="telemetry"><div><small>LAP</small><strong id="lap">0 / 3</strong></div><div><small>SPEED</small><strong id="speed">0 km/h</strong></div><div><small>GEAR</small><strong id="gear">N</strong></div><div><small>RPM</small><strong id="rpm">0</strong></div><div><small>BEST</small><strong id="best">--:--.---</strong></div><div><small>TRACK LIMIT</small><strong id="limits">OK</strong></div></div></div></section><script>function f(ms){if(!ms)return'--:--.---';let m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),x=ms%1000;return`${m}:${String(s).padStart(2,'0')}.${String(x).padStart(3,'0')}`}async function load(){let s=await(await fetch('/api/state')).json(),r=s.rig,a=s.active;if(!a){location.href='/';return}driver.textContent=a.display_name;if(r){phase.textContent=(r.state||'PREPARING').replaceAll('_',' ').toUpperCase();time.textContent=f(r.current_ms);lap.textContent=`${Math.min((r.completed_laps||0)+1,3)} / 3`;speed.textContent=`${Math.round(r.speed||0)} km/h`;gear.textContent=r.gear===1?'N':Math.max(0,(r.gear||1)-1);rpm.textContent=r.rpm||0;best.textContent=f(r.best_ms);limits.textContent=(r.tyres_out||0)>2?'INVALID':'OK'} }load();setInterval(load,250)</script>{% endblock %}
