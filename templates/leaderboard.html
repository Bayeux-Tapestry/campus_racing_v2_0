{% extends 'base.html' %}{% block body %}<section class="screen"><header><div><div class="eyebrow">CAMPUS RACING // OFFICIAL TIMING</div><h1>{{cfg.track_name}} <span>×</span> {{cfg.car_name}}</h1></div><div class="tabs"><button data-p="today">TODAY</button><button data-p="week">7 DAYS</button><button class="on" data-p="all">ALL TIME</button></div></header><div class="leader-head"><span>POS</span><span>DRIVER</span><span>BEST LAP</span><span>GAP</span></div><div id="lb" class="leader-list"></div><footer id="stats"></footer></section><script>const root=document.getElementById('lb');let period='all';document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{period=b.dataset.p;document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b));load()});async function load(){let s=await(await fetch('/api/state')).json(),a=period==='today'?s.today:period==='week'?s.week:s.leaders;root.innerHTML=a.length?a.map(x=>`<div class="leader-row"><b>P${x.position}</b><span>${x.name}</span><strong>${x.lap}</strong><em>${x.gap}</em></div>`).join(''):'<div class="empty">NO TIMES YET — SET THE FIRST RECORD</div>';document.getElementById('stats').textContent=`${s.stats.d} DRIVERS  •  ${s.stats.a} HOT-LAP ATTEMPTS  •  ${s.cfg.event_name}`;if(s.active&&['out_lap','hot_lap','in_lap'].includes(s.rig?.state))location.href='/live'}load();setInterval(load,1500)</script>{% endblock %}
